[project]
name = "wechat-hot-radar"
version = "0.1.0"
description = "Truth-first, free and on-demand WeChat Official Account article ranking pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "HOUUTOU"}]
keywords = ["wechat", "official-account", "ranking", "rss", "open-data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
wechat-hot-radar = "wechat_hot_radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
